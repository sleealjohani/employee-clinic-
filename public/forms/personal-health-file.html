<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الملف الصحي — Personal Health File</title>
<style>
/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root{
  --moh-green:#008556;
  --moh-green-d:#006a45;
  --moh-gold:#9e925e;
  --ink:#12100e;
  --pen:#16233f;            /* colour of data printed into the form */
  --rule:#161616;           /* table rules */
  --paper:#fbfaf6;          /* warm off-white, screen only */
  --desk:#23272c;
  --desk-2:#2c3138;
  --chrome:#c8cdd3;
  --focus:#7fd3a5;
  /* Janna LT first: if the clinic workstation has it installed it is used,
     otherwise we fall back to system Arabic faces. No web fonts are loaded. */
  --ar:"Janna LT","Noto Naskh Arabic","Segoe UI",Tahoma,"Geeza Pro","Arabic Typesetting",Arial,sans-serif;
  --en:"Segoe UI",Tahoma,Arial,Helvetica,sans-serif;
}

.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--desk);
  color:var(--chrome);
  font-family:var(--ar);
  -webkit-text-size-adjust:100%;
  overscroll-behavior:contain;
}

/* ==========================================================================
   2. SHELL / CHROME
   ========================================================================== */
#shell{display:flex;flex-direction:column;height:100%;min-height:0}

#toolbar{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--desk-2);
  border-bottom:1px solid rgba(255,255,255,.07);
  flex:0 0 auto;overflow-x:auto;scrollbar-width:none;
}
#toolbar::-webkit-scrollbar{display:none}
#toolbar .title{
  font-size:13px;letter-spacing:.01em;color:#e8ecef;font-weight:600;
  white-space:nowrap;margin-inline-end:4px;
}
#toolbar .sub{font-size:11px;color:#8a939c;white-space:nowrap;margin-inline-end:auto}
.btn{
  appearance:none;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.04);color:var(--chrome);
  font-family:inherit;font-size:12.5px;line-height:1;
  padding:8px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;
  transition:background .14s ease,border-color .14s ease;
}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{background:rgba(255,255,255,.16)}
.btn[aria-pressed="true"]{background:rgba(127,211,165,.16);border-color:rgba(127,211,165,.45);color:#dff5e8}
.btn:focus-visible,#book:focus-visible,.thumb:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.counter{font-size:12px;color:#9aa3ac;min-width:56px;text-align:center;white-space:nowrap}
.dirty-indicator{font-size:11px;color:#e7dca9;white-space:nowrap;padding:4px 7px;border:1px solid rgba(231,220,169,.28);border-radius:99px;background:rgba(158,146,94,.10)}

#viewport{
  position:relative;flex:1 1 auto;min-height:0;
  overflow:auto;display:grid;place-content:center;
  padding:14px;
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.045),transparent 60%),
    var(--desk);
  touch-action:pan-y;
}
#stageWrap{position:relative}
#stage{position:absolute;top:0;left:0;transform-origin:0 0}

/* ==========================================================================
   3. BOOK BODY
   ========================================================================== */
#book{
  position:relative;height:297mm;touch-action:pan-y;
  perspective:2400px;perspective-origin:50% 42%;
  outline:none;
}
.slot{position:absolute;top:0;width:210mm;height:297mm;overflow:hidden}
.slot.left{left:0}
.slot.right{left:210mm}
#book.single .slot.right{display:none}
.slot .page{box-shadow:0 10px 26px rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.3)}

/* stack of page edges either side of the spine */
.stack{position:absolute;top:2mm;height:calc(297mm - 4mm);width:5mm;pointer-events:none;
  background:repeating-linear-gradient(90deg,#efece4 0 .55mm,#cfcabb .55mm 1.05mm);
  transform-origin:50% 50%;box-shadow:0 6px 16px rgba(0,0,0,.35);border-radius:.6mm;}
.stack.l{left:-4.4mm;transform-origin:100% 50%;border-radius:1mm 0 0 1mm}
.stack.r{left:calc(420mm - .6mm);transform-origin:0 50%;border-radius:0 1mm 1mm 0}
#book.single .stack.r{left:calc(210mm - .6mm)}
#book.single .stack.l{display:none}

/* permanent gutter shadow at the spine */
.gutter{position:absolute;top:0;height:297mm;width:22mm;pointer-events:none;z-index:6}
.gutter.l{left:calc(210mm - 22mm);background:linear-gradient(to right,rgba(0,0,0,0),rgba(0,0,0,.20))}
.gutter.r{left:210mm;background:linear-gradient(to right,rgba(0,0,0,.20),rgba(0,0,0,0))}
#book.single .gutter.r{display:none}
#book.single .gutter.l{opacity:.55}

/* shadow the turning leaf casts on the sheets underneath */
.cast{position:absolute;top:0;height:297mm;width:210mm;pointer-events:none;opacity:0;z-index:7}
.cast.l{left:0;transform-origin:100% 50%;
  background:linear-gradient(to left,rgba(0,0,0,.42),rgba(0,0,0,.16) 32%,rgba(0,0,0,0) 76%)}
.cast.r{left:210mm;transform-origin:0% 50%;
  background:linear-gradient(to right,rgba(0,0,0,.42),rgba(0,0,0,.16) 32%,rgba(0,0,0,0) 76%)}

/* ==========================================================================
   4. TURNING LEAF (strip curl)
   ========================================================================== */
.turning{
  position:absolute;top:0;left:0;width:210mm;height:297mm;
  transform-style:preserve-3d;z-index:20;will-change:transform;
}
.strip{
  position:absolute;top:0;height:297mm;
  transform-style:preserve-3d;transform-origin:100% 50%;
  will-change:transform;
}
.face{
  position:absolute;inset:0;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);
}
.face.back{transform:rotateY(180deg)}
.face .holder{position:absolute;top:0;left:0;transform-origin:0 0;width:210mm;height:297mm}
.face .bleed{opacity:.06}
.face .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.face .sheen{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* corner peel hit area (free edge = the outer edge, away from the spine) */
.peel{position:absolute;left:0;width:34mm;height:34mm;z-index:25;cursor:grab}
.peel.tl{top:0}
.peel.bl{bottom:0}
.peel:active{cursor:grabbing}

/* reduced-motion / no-3d fallback */
#book.flat .slot .page{transition:opacity .2s ease}
#book.flat .fade{opacity:0}

/* ==========================================================================
   5. THUMBNAIL RAIL
   ========================================================================== */
#rail{
  flex:0 0 auto;display:none;gap:8px;padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  overflow-x:auto;background:var(--desk-2);
  border-top:1px solid rgba(255,255,255,.07);
}
#rail.open{display:flex}
.thumb{
  position:relative;flex:0 0 auto;border:1px solid rgba(255,255,255,.16);
  border-radius:4px;overflow:hidden;background:#fff;padding:0;cursor:pointer;
}
.thumb .mini{position:absolute;top:0;left:0;transform-origin:0 0;pointer-events:none}
.thumb .num{
  position:absolute;inset-inline-end:3px;bottom:2px;font-size:10px;color:#333;
  background:rgba(255,255,255,.85);border-radius:3px;padding:0 3px;
}
.thumb[aria-current="true"]{border-color:var(--focus);box-shadow:0 0 0 2px rgba(127,211,165,.35)}

/* ==========================================================================
   6. THE PAPER — A4 pages, millimetre geometry
   ========================================================================== */
.page{
  position:relative;width:210mm;height:297mm;
  padding:11mm 12mm 9mm;
  background:var(--paper);
  color:var(--ink);
  direction:rtl;
  font-family:var(--ar);
  font-size:9pt;line-height:1.35;
  overflow:hidden;contain:layout paint;
  --tex:1;
}
/* faint paper texture, screen only */
.page::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:calc(.5 * var(--tex));
  background:
    repeating-linear-gradient(0deg,rgba(120,110,90,.045) 0 .18mm,rgba(0,0,0,0) .18mm .9mm),
    radial-gradient(90% 60% at 25% 12%,rgba(255,255,255,.5),rgba(0,0,0,0) 70%),
    radial-gradient(80% 70% at 80% 95%,rgba(120,110,80,.05),rgba(0,0,0,0) 70%);
  mix-blend-mode:multiply;
}
.face .page::after,.thumb .page::after{display:none}
.page > *{position:relative;z-index:1}

/* --- letterhead --- */
.lh{display:flex;direction:ltr;align-items:flex-start;justify-content:space-between;gap:6mm}
.lh .col{font-size:7.6pt;line-height:1.5;color:var(--moh-green-d);font-weight:600;white-space:nowrap}
.lh .en{text-align:left;font-family:var(--en);letter-spacing:.01em}
.lh .ar{text-align:right;direction:rtl}
.lh.cover .col{font-size:8.6pt}
.lh .mark{flex:0 0 auto}
.lh.inner{align-items:flex-start}
.lh.inner .ar{margin-inline-start:auto}

/* --- pill title --- */
.pill{
  display:flex;align-items:center;justify-content:center;gap:6mm;
  background:var(--moh-green);color:#fff;border-radius:99mm;
  padding:1.6mm 9mm;margin:0 auto;width:max-content;max-width:100%;
  font-weight:700;letter-spacing:.005em;
  box-shadow:inset 0 -0.6mm 0 rgba(0,0,0,.08);
}
.pill .e{font-family:var(--en);font-size:11.5pt}
.pill .a{font-size:12pt}
.pill.big .e{font-size:13.5pt}
.pill.big .a{font-size:14pt}
.pill.solo{gap:0}

/* --- character boxes --- */
.boxes{display:flex;direction:ltr;flex:0 0 auto}
.box{
  width:7.4mm;height:7.6mm;border:.32mm solid var(--rule);
  margin-left:-.32mm;display:flex;align-items:center;justify-content:center;
  font-family:var(--en);font-size:10pt;font-weight:600;color:var(--pen);background:transparent;
}
.box:first-child{margin-left:0}
.boxes.sm .box{width:6.2mm;height:6.6mm;font-size:9pt}
.row{display:flex;align-items:center;gap:3mm}
.row.rtl{direction:rtl}
.row.center{justify-content:center}
.lab{font-weight:700;white-space:nowrap}
.sep{font-family:var(--en);font-weight:700;padding:0 1mm}

/* --- data values --- */
.v{color:var(--pen);font-weight:600}
.v.en{font-family:var(--en)}

/* --- in-place field editing --------------------------------------------- */
.page [data-bind]{
  min-width:0;
  caret-color:var(--pen);
}
.page [data-bind][contenteditable="true"],
.page [data-bind][contenteditable="plaintext-only"]{
  cursor:text;
}
body.is-editable .page [data-bind]:hover{
  background-color:rgba(158,146,94,.07);
}
body.is-editable .page [data-bind]:focus,
body.is-editable .page [data-bind]:focus-visible{
  outline:.3mm solid var(--moh-green);
  outline-offset:-.15mm;
}
.page .v[data-bind]{display:block;min-height:1em}
.dline .v[data-bind]{display:block}
.box[data-bind]{
  padding:0;
  white-space:pre;
  overflow:hidden;
  text-align:center;
}
.chk[data-bind]{
  border-radius:.6mm;
}
.multiline-row{align-items:flex-start}
.mfield{
  position:relative;
  display:block;
  flex:1 1 auto;
  width:100%;
  min-width:0;
  height:calc(var(--lines) * 8.6mm);
  overflow:hidden;
  padding:0 1.5mm;
  color:var(--pen);
  font-weight:600;
  line-height:8.6mm;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background-image:radial-gradient(circle,#2a2a2a 0 .16mm,transparent .18mm);
  background-size:1.2mm 8.6mm;
  background-position:0 8.25mm;
  background-repeat:repeat;
}
.mfield.en{font-family:var(--en);direction:ltr;text-align:left}
.turning [data-bind],.thumb [data-bind]{pointer-events:none}

/* --- tables --- */
table.t{width:100%;border-collapse:collapse;table-layout:fixed;background:transparent}
table.t th,table.t td{
  border:.3mm solid var(--rule);
  padding:.9mm 1.4mm;height:7mm;
  font-size:8.2pt;font-weight:400;vertical-align:middle;text-align:center;
  word-break:break-word;
}
table.t th,table.t td.g{
  background:var(--moh-green);color:#fff;font-weight:700;font-size:8.4pt;
}
table.t.en{direction:ltr;font-family:var(--en)}
table.t.en td.name{text-align:left;padding-inline-start:2mm}
table.t td.hdw{font-weight:700;font-size:8pt}
table.t td.tall{height:11mm}
table.t td.blank{height:8mm}
table.t .v{display:block;min-height:1em}

/* --- framed blocks --- */
.frame{border:.32mm solid var(--rule);padding:4mm 5mm}
.fld{display:flex;align-items:flex-end;gap:2mm;margin-bottom:3.2mm}
.fld .lbl{white-space:nowrap;font-weight:600;font-size:9pt}
.fld.en{direction:ltr;font-family:var(--en)}
.dline{position:relative;flex:1 1 auto;height:5.4mm;border-bottom:.32mm dotted #2a2a2a}
.dline .v{position:absolute;inset-inline:1.5mm;bottom:.9mm;font-size:8.6pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dline.solid{border-bottom-style:solid;border-bottom-width:.25mm}

/* --- misc page furniture --- */
.warn{text-align:center;font-weight:700}
.warn .a{font-size:13.5pt;letter-spacing:.005em}
.warn .e{font-family:var(--en);font-size:12pt;margin-top:1.5mm}
.cap{display:flex;direction:ltr;justify-content:space-between;align-items:flex-end;font-weight:700;font-size:10pt;margin-bottom:1.5mm}
.cap .e{font-family:var(--en);color:var(--ink)}
.allergy{
  border:.32mm solid var(--moh-green);display:flex;direction:ltr;align-items:center;
  gap:4mm;padding:3mm 4mm;min-height:13mm;
}
.allergy .e{font-family:var(--en);color:var(--moh-green-d);font-weight:700;font-size:11pt}
.allergy .a{color:var(--moh-green-d);font-weight:700;font-size:11pt;margin-inline-start:auto}
.allergy .v{flex:1 1 auto;text-align:center}
.conf{display:flex;direction:ltr;justify-content:center;gap:4mm;color:var(--moh-green-d);font-weight:700;margin-top:2.5mm}
.conf .e{font-family:var(--en);font-size:11pt}
.conf .a{font-size:11.5pt}
.badge{
  position:absolute;bottom:6mm;left:50%;transform:translateX(-50%);
  border:.3mm solid var(--rule);border-radius:99mm;
  min-width:11mm;padding:.4mm 3mm;text-align:center;font-size:9.5pt;font-weight:600;
}
.note{font-size:8pt;font-family:var(--en);margin-top:1.5mm}
.chk{display:inline-flex;align-items:center;gap:1.5mm;margin-inline-start:4mm}
.chk i{width:4.2mm;height:4.2mm;border:.3mm solid var(--rule);display:inline-block;
  font-style:normal;text-align:center;line-height:3.8mm;font-size:8pt;color:var(--pen);font-weight:700}
.page.flow{display:flex;flex-direction:column}
.page.flow>*{flex:0 0 auto}
.spacer{flex:1 1 auto;min-height:3mm}
.spacer.g2{flex-grow:2}
.stack-v{display:flex;flex-direction:column;height:100%}
.gap-s{height:4mm}.gap-m{height:8mm}.gap-l{height:14mm}
.cover-mark{display:flex;justify-content:center;margin:2mm 0 3mm}
.back-mark{display:flex;align-items:center;justify-content:center;height:100%}

/* ==========================================================================
   7. PRINT — eight flat A4 sheets, full-strength ink
   ========================================================================== */
#printRoot{display:none}

@media print{
  @page{size:A4 portrait;margin:0}
  html,body{height:auto;background:#fff}
  #shell{display:none !important}
  #printRoot{display:block}
  #printRoot .page{
    --tex:0;
    background:#fff;box-shadow:none;margin:0;
    break-after:page;page-break-after:always;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  #printRoot .page::after{display:none}
  #printRoot .page:last-child{break-after:auto;page-break-after:auto}
  [contenteditable]{outline:none !important}
  #printRoot [contenteditable],
  #printRoot [data-bind]{
    outline:none !important;
    background-color:transparent !important;
    caret-color:transparent !important;
  }
}

@media (prefers-reduced-motion:reduce){
  .btn{transition:none}
}
</style>
</head>

<script>
/*!
 * الملف الصحي — Personal Health File
 * Employee Health Clinic · Infection Control Dep
 * Haditha General Hospital · Gurayat Health Affairs · Saudi Ministry of Health
 *
 * Self-contained: one HTML file, no build step, no CDN, no web fonts, no images.
 * Works offline and inside an <iframe>.
 *
 * ---------------------------------------------------------------------------
 * WHY THE CURL IS DONE WITH CSS STRIPS AND NOT WEBGL
 * ---------------------------------------------------------------------------
 * A WebGL page (PlaneGeometry + a cylindrical-bend vertex shader) needs the two
 * faces of the leaf as *textures*. In a single offline file there is no
 * Three.js to load, and the only way to turn this DOM into a texture is the
 * SVG <foreignObject> trick, which (a) renders Arabic shaping inconsistently
 * across engines, (b) taints the canvas in some of them — which then makes
 * texImage2D throw — and (c) throws away the vector text that makes the printed
 * A4 output identical to the clinic's original form.
 *
 * So the leaf is simulated in CSS instead. The sheet is sliced into N vertical
 * strips; each strip is a real, cloned copy of the page clipped to its own
 * slice, and the strips are laid out along a bend curve that is integrated
 * strip by strip (position_{i+1} = position_i + w·(-cos a_i, sin a_i)). Because
 * consecutive strips share an exact edge point, the surface is continuous — no
 * gaps, no faceting seams — and the bend is a genuine curve rather than one
 * rotateY. Per frame we only write `transform` and two custom properties used
 * for shading: no layout, no repaint of the page content, compositor only.
 * The pages stay live DOM, so RTL text, selection and vector printing all work.
 *
 * Degradation: if `prefers-reduced-motion` is set, or preserve-3d is
 * unsupported, the engine switches to a cross-fade (see FLAT_MODE).
 *
 * ---------------------------------------------------------------------------
 * BINDING DIRECTION
 * ---------------------------------------------------------------------------
 * This is an Arabic book: the spine is in the middle of the spread and the

      book.classList.toggle('single', mode === 'single');
      renderStatic();
      prewarm();
    }

    var bookW = (mode === 'spread' ? 2 : 1) * PAGE_W;
    book.style.width = bookW + 'px';

    var availW = Math.max(120, viewport.clientWidth - 28);
    var availH = Math.max(120, viewport.clientHeight - 28);
    fitScale = Math.min(availW / bookW, availH / PAGE_H);
    scale = fitScale * zoom;

    stage.style.transform = 'scale(' + scale + ')';
    stage.style.width = bookW + 'px';
    stage.style.height = PAGE_H + 'px';
    stageWrap.style.width = (bookW * scale) + 'px';
    stageWrap.style.height = (PAGE_H * scale) + 'px';
  }

  function updateChrome() {
    var st = stateVal();
    var label;
    if (mode === 'spread') {
      var r = st > 0 ? 2 * st : 0;              // right-hand page number
      var l = st < 4 ? 2 * st + 1 : 0;          // left-hand page number
      if (r && l) label = arNum(r) + '–' + arNum(l);
      else label = arNum(r || l);
    } else {
      label = arNum(st + 1);
    }
    counterEl.textContent = label + ' / ' + arNum(N_PAGES);
    var thumbs = rail.querySelectorAll('.thumb');
    var cur = currentPageIndex();
    for (var i = 0; i < thumbs.length; i++) {
      thumbs[i].setAttribute('aria-current', String(i === cur || (mode === 'spread' && i === cur - 1)));
    }
  }

  function buildRail() {
    if (!railDirty) { updateChrome(); return; }
    while (rail.firstChild) rail.removeChild(rail.firstChild);
    var k = 0.085;
    for (var i = 0; i < pages.length; i++) {
      (function (i) {
        var b = h('button', {
          class: 'thumb', type: 'button',
          style: 'width:' + (PAGE_W * k) + 'px;height:' + (PAGE_H * k) + 'px',
          'aria-label': 'صفحة ' + arNum(i + 1)
        });
        var mini = h('div', { class: 'mini' });
        mini.style.transform = 'scale(' + k + ')';
        mini.appendChild(pages[i].cloneNode(true));
        b.appendChild(mini);
        b.appendChild(h('span', { class: 'num' }, arNum(i + 1)));
        b.addEventListener('click', function () { goToPage(i); });
        rail.appendChild(b);
      })(i);
    }
    railDirty = false;
    updateChrome();
  }

  function boot() {
    stage = document.getElementById('stage');
    stageWrap = document.getElementById('stageWrap');
    viewport = document.getElementById('viewport');
    book = document.getElementById('book');
    printRoot = document.getElementById('printRoot');
    rail = document.getElementById('rail');
    counterEl = document.getElementById('counter');
    dirtyIndicator = document.getElementById('dirtyIndicator');

    slotR = h('div', { class: 'slot right' });
    slotL = h('div', { class: 'slot left' });
    castR = h('div', { class: 'cast r' });
    castL = h('div', { class: 'cast l' });
    stackL = h('div', { class: 'stack l' });
    stackR = h('div', { class: 'stack r' });
    peelTop = h('div', { class: 'peel tl' });
    peelBottom = h('div', { class: 'peel bl' });
    append(book, [
      stackL, stackR, slotR, slotL,
      h('div', { class: 'gutter r' }), h('div', { class: 'gutter l' }),
      castR, castL, peelTop, peelBottom
    ]);
    if (FLAT) book.classList.add('flat');

    pages = BUILDERS.map(function (fn) { return fn(DATA); });
    configureAllBoundNodes();
    book.classList.toggle('single', mode === 'single');
    layout();
    renderStatic();
    prewarm();

    /* input */
    bindEditingEvents(book);
    bindEditingEvents(printRoot);
    book.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    peelTop.addEventListener('pointerenter', onPeelEnter('top'));
    peelBottom.addEventListener('pointerenter', onPeelEnter('bottom'));
    peelTop.addEventListener('pointerleave', onPeelLeave);
    peelBottom.addEventListener('pointerleave', onPeelLeave);

    book.addEventListener('keydown', function (e) {
      /* Field keystrokes belong to the field. Book navigation only runs when
         the application surface itself owns focus. */
      if (e.target !== book) return;
      if (e.key === 'ArrowLeft') { animateStep(true); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { animateStep(false); e.preventDefault(); }
      else if (e.key === 'Home') { goToPage(0); e.preventDefault(); }
      else if (e.key === 'End') { goToPage(N_PAGES - 1); e.preventDefault(); }
    });

    /* toolbar */
    document.getElementById('btnNext').addEventListener('click', function () { animateStep(true); });
    document.getElementById('btnPrev').addEventListener('click', function () { animateStep(false); });
    document.getElementById('btnPrint').addEventListener('click', doPrint);
    document.getElementById('btnClear').addEventListener('click', function () { API.clear(); });
    document.getElementById('btnSample').addEventListener('click', function () { API.setData(SAMPLE); });
    document.getElementById('btnThumbs').addEventListener('click', function () {
      var open = rail.classList.toggle('open');
      this.setAttribute('aria-pressed', String(open));
      if (open) buildRail();
      layout();
    });
    document.getElementById('btnZoomIn').addEventListener('click', function () {
      zoom = Math.min(2.4, zoom * 1.25); layout();
    });
    document.getElementById('btnZoomOut').addEventListener('click', function () {
      zoom = Math.max(0.6, zoom / 1.25); layout();
    });

    /* layout */
    window.addEventListener('resize', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(viewport);

    /* printing from the browser's own menu */
    window.addEventListener('beforeprint', enterPrint);
    window.addEventListener('afterprint', exitPrint);
    if (window.matchMedia) {
      var mq = window.matchMedia('print');
      var onMQ = function (m) { if (m.matches) enterPrint(); else exitPrint(); };
      if (mq.addEventListener) mq.addEventListener('change', onMQ);
      else if (mq.addListener) mq.addListener(onMQ);
    }

    window.addEventListener('beforeunload', beforeUnloadGuard);
  }

  /* =======================================================================
     10. GLOBAL API
     ======================================================================= */

  var API = {
    /**
     * Merge an employee record into the form and re-render. During editing the
     * active field wins over an incoming refresh, then focus is restored.
     */
    setData: function (employee) {
      var active = editableEnabled ? activeBound() : null;
      var activePath = active ? active.dataset.bind : null;
      var activeValue;
      if (activePath) {
        if (active.dataset.field === 'box') activeValue = valueFromBoxes(active);
        else if (active.dataset.field === 'choice') activeValue = getByPath(DATA, activePath);
        else activeValue = textFromEditable(active);
      }

      if (employee && typeof employee === 'object') mergeInto(DATA, employee);
      if (activePath) setByPath(DATA, activePath, activeValue);
      rebuildPages();
      if (activePath) focusFieldInternal(activePath);
      return API;
    },

    /** Deep clone of the same DATA shape accepted by setData(). */
    getData: function () { return deepClone(DATA); },

    /** Back to a blank, printable form. In edit mode this is a real change. */
    clear: function () {
      blurActiveEditable();
      DATA = {};
      rebuildPages();
      if (editableEnabled) {
        dirty = true;
        updateDirtyIndicator();
        scheduleChange('');
      } else {
        dirty = false;
        updateDirtyIndicator();
      }
      return API;
    },

    /** Enable/disable in-place editing. Read-only remains the default. */
    setEditable: function (on) {
      on = !!on;
      if (!on) blurActiveEditable();
      editableEnabled = on;
      configureAllBoundNodes();
      return API;
    },

    /**
     * Register a debounced change consumer. Returns an unsubscribe function;
     * registering a consumer also tells the iframe that the host owns saving.
     */
    onChange: function (fn) {
      if (typeof fn !== 'function') return function () {};
      if (changeConsumers.indexOf(fn) < 0) changeConsumers.push(fn);
      return function () {
        var i = changeConsumers.indexOf(fn);
        if (i >= 0) changeConsumers.splice(i, 1);
      };
    },

    isDirty: function () { return dirty; },

    /** Acknowledge a successful host save without touching DATA. */
    markSaved: function () {
      dirty = false;
      updateDirtyIndicator();
      return API;
    },

    /** Open the page containing a path and place the caret in its first node. */
    focusField: function (path) {
      focusFieldInternal(String(path || ''));
      return API;
    },

    /**
     * Optional host-owned draft buffer. No localStorage is ever used here.
     * getter may synchronously return a DATA-shaped object; setter receives a
     * deep clone on the same debounce as onChange.
     */
    setDraftStore: function (getter, setter) {
      draftGetter = typeof getter === 'function' ? getter : null;
      draftSetter = typeof setter === 'function' ? setter : null;
      if (draftGetter) {
        try {
          var draft = draftGetter();
          if (draft && typeof draft === 'object') API.setData(draft);
        } catch (err) { /* the draft store belongs to the host */ }
      }
      return API;
    },

    /** 0-based page index; in spread mode it opens the spread holding it. */
    goTo: function (pageIndex) { goToPage(pageIndex); return API; },
    next: function () { animateStep(true); return API; },
    prev: function () { animateStep(false); return API; },
    print: function () { doPrint(); return API; },

    /** Hide the toolbar and the thumbnail rail when embedded in the platform. */
    setChrome: function (on) {
      document.getElementById('toolbar').style.display = on ? '' : 'none';
      if (!on) rail.classList.remove('open');
      layout();
      return API;
    },

    get page() { return currentPageIndex(); }
  };

  window.PersonalHealthFile = API;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
